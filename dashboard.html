<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapo Analytics | Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">

    <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-card">
            <h2>Nenhum dado carregado</h2>
            <p>Importe uma planilha para visualizar o dashboard.</p>
            <a href="index.html" class="btn-primary" id="emptyStateImportBtn">Importar planilha</a>
        </div>
    </div>

    <div id="app" style="display:flex; width:100%;">

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">K</div>
                <span class="brand-name">Kapo <strong>Analytics</strong></span>
            </div>

            <nav>
                <div class="sidebar-section-label">Menu</div>
                <div class="sidebar-nav">
                    <a class="sidebar-link active" data-view="dashboard">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
                        Dashboard
                    </a>
                    <a class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 4v3M16 4v3"/></svg>
                        Histórico
                    </a>
                    <a class="sidebar-link" data-view="reports">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20V10M18 20V4M6 20v-6"/></svg>
                        Relatórios
                    </a>
                </div>
            </nav>

            <nav style="margin-top:auto;">
                <div class="sidebar-section-label">Outros</div>
                <div class="sidebar-nav">
                    <a class="sidebar-link" id="newImportLink" href="index.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4M12 4L7 9M12 4l5 5"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
                        Nova importação
                    </a>
                    <a class="sidebar-link" id="clearCacheLink" href="#">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
                        Limpar Dashboard
                    </a>
                </div>
            </nav>
        </aside>

        <div class="content-shell">
            <header class="topbar">
                <span class="topbar-title" id="topbarTitle">Dashboard</span>

                <div class="topbar-controls">
                    <div class="sheet-select-wrap">
                        <select id="sheetSelect" class="sheet-select"></select>
                        <button type="button" id="manageSheetsBtn" class="btn-icon" title="Escolher abas visíveis" aria-label="Escolher abas visíveis">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                            </svg>
                        </button>
                        <div id="sheetManagerPanel" class="sheet-manager-panel" hidden></div>
                    </div>
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar em todos os campos...">
                    <a href="index.html" class="btn-secondary" id="newImportBtnTop">Nova importação</a>
                </div>
            </header>

            <main class="main-grid" id="dashboardView">

                <section class="filters-section">
                    <div class="filters-header">
                        <span>Filtros <span id="filterCountBadge" class="filter-count-badge" style="display:none;">0</span></span>
                        <button id="clearFiltersBtn" class="btn-link">Limpar</button>
                    </div>
                    <div id="filtersRow" class="filters-row"></div>
                    <div id="activeChipsRow" class="active-chips-row"></div>
                </section>

                <section id="kpiRow" class="kpi-row"></section>

                <section id="chartsGrid" class="charts-grid"></section>

                <section class="table-section">
                    <div class="table-header">
                        <h3>Detalhamento</h3>
                        <div style="display:flex; align-items:center; gap:14px;">
                            <span id="rowCountLabel" class="row-count"></span>
                            <button id="configColumnsBtn" class="btn-link">Configurar colunas</button>
                        </div>
                    </div>
                    <div id="columnPickerPanel" class="column-picker-panel" style="display:none;"></div>
                    <div class="table-scroll">
                        <table id="dataTable"></table>
                    </div>
                </section>

            </main>

            <main class="main-grid" id="reportsView" style="display:none;">
                <div id="reportsContainer"></div>
            </main>
        </div>
    </div>

    <script src="js/Enginemotor/utils.js"></script>
    <script src="js/Enginemotor/analyzer.js"></script>
    <script src="js/Enginemotor/statistics.js"></script>
    <script src="js/Enginemotor/indexer.js"></script>
    <script src="js/Enginemotor/database.js"></script>
    <script src="js/Enginemotor/filters.js"></script>
    <script src="js/vendor/chart.umd.js"></script>
    <script src="js/Enginemotor/charts.js"></script>
    <script src="js/Enginemotor/dashboard.js"></script>
</body>
</html>
