<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapo Analytics | Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">

    <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-card">
            <h2>Nenhum dado carregado</h2>
            <p>Importe uma planilha para visualizar o dashboard.</p>
            <a href="index.html" class="btn-primary">Importar planilha</a>
        </div>
    </div>

    <div id="app" style="display:flex; width:100%;">

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">K</div>
                <span class="brand-name">Kapo <strong>Analytics</strong></span>
            </div>

            <nav>
                <div class="sidebar-section-label">Menu</div>
                <div class="sidebar-nav">
                    <a class="sidebar-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
                        Dashboard
                    </a>
                    <a class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 4v3M16 4v3"/></svg>
                        Histórico
                    </a>
                    <a class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20V10M18 20V4M6 20v-6"/></svg>
                        Relatórios
                    </a>
                </div>
            </nav>

            <nav style="margin-top:auto;">
                <div class="sidebar-section-label">Outros</div>
                <div class="sidebar-nav">
                    <a class="sidebar-link" href="index.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4M12 4L7 9M12 4l5 5"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
                        Nova importação
                    </a>
                </div>
            </nav>
        </aside>

        <div class="content-shell">
            <header class="topbar">
                <span class="topbar-title">Dashboard</span>

                <div class="topbar-controls">
                    <select id="sheetSelect" class="sheet-select"></select>
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar em todos os campos...">
                    <a href="index.html" class="btn-secondary">Nova importação</a>
                </div>
            </header>

            <main class="main-grid">

                <section class="filters-section">
                    <div class="filters-header">
                        <span>Filtros</span>
                        <button id="clearFiltersBtn" class="btn-link">Limpar</button>
                    </div>
                    <div id="filtersRow" class="filters-row"></div>
                </section>

                <section id="kpiRow" class="kpi-row"></section>

                <section id="chartsGrid" class="charts-grid"></section>

                <section class="table-section">
                    <div class="table-header">
                        <h3>Detalhamento</h3>
                        <span id="rowCountLabel" class="row-count"></span>
                    </div>
                    <div class="table-scroll">
                        <table id="dataTable"></table>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/analyzer.js"></script>
    <script src="js/statistics.js"></script>
    <script src="js/indexer.js"></script>
    <script src="js/database.js"></script>
    <script src="js/filters.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
